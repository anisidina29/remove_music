name: Streamtape windows

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 10 * * *'   # 1:30 AM VN (10:30 AM PST)
  #   - cron: '45 10 * * *'   # 1:45 AM VN (10:45 AM PST)
  #   - cron: '0 11 * * *'    # 2:00 AM VN (11:00 AM PST)
  #   - cron: '15 11 * * *'   # 2:15 AM VN (11:15 AM PST)
  #   - cron: '30 11 * * *'   # 2:30 AM VN (11:30 AM PST)
  #   - cron: '45 11 * * *'   # 2:45 AM VN (11:45 AM PST)
  #   - cron: '0 12 * * *'    # 3:00 AM VN (12:00 PM PST)
  #   - cron: '15 12 * * *'   # 3:15 AM VN (12:15 PM PST)
  #   - cron: '30 12 * * *'   # 3:30 AM VN (12:30 PM PST)
  #   - cron: '45 12 * * *'   # 3:45 AM VN (12:45 PM PST)
  #   - cron: '0 13 * * *'    # 4:00 AM VN (1:00 PM PST)
  #   - cron: '15 13 * * *'   # 4:15 AM VN (1:15 PM PST)
  #   - cron: '30 13 * * *'   # 4:30 AM VN (1:30 PM PST)
  #   - cron: '45 13 * * *'   # 4:45 AM VN (1:45 PM PST)
  #   - cron: '0 14 * * *'    # 5:00 AM VN (2:00 PM PST)
  #   - cron: '15 14 * * *'   # 5:15 AM VN (2:15 PM PST)
  #   - cron: '30 14 * * *'   # 5:30 AM VN (2:30 PM PST)
  #   - cron: '45 14 * * *'   # 5:45 AM VN (2:45 PM PST)
  #   - cron: '0 15 * * *'    # 6:00 AM VN (3:00 PM PST)
  #   - cron: '15 15 * * *'   # 6:15 AM VN (3:15 PM PST)
  #   - cron: '30 15 * * *'   # 6:30 AM VN (3:30 PM PST)
  #   - cron: '45 15 * * *'   # 6:45 AM VN (3:45 PM PST)
  #   - cron: '0 16 * * *'    # 7:00 AM VN (4:00 PM PST)
  #   - cron: '15 16 * * *'   # 7:15 AM VN (4:15 PM PST)
  #   - cron: '30 16 * * *'   # 7:30 AM VN (4:30 PM PST)
  #   - cron: '45 16 * * *'   # 7:45 AM VN (4:45 PM PST)
  

jobs:
  capture_screenshots:
    strategy:
      matrix:
        runs-on: [windows-latest, windows-latest, windows-latest, windows-latest, windows-latest, windows-latest, windows-latest, windows-latest, windows-latest, windows-latest]  # 7 instances
    runs-on: ${{ matrix.runs-on }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
           python-version: '3.10'
        
      - name: Install dependencies
        run: pip install undetected-chromedriver selenium pyvirtualdisplay pyautogui fake-useragent

      - name: Run Selenium script
        run: python streamtape.py
        
      - name: Archive screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: '**/*.png'
